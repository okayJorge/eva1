{% extends 'base.html' %}
{% block content %}
<h4 class="mb-3">Configuración del edificio</h4>
<div class="card p-4" style="max-width:500px;">
  <form method="post">
    <div class="mb-2">
      <label class="form-label">Nombre del edificio</label>
      <input type="text" name="nombre_edificio" class="form-control" value="{{ cfg.nombre_edificio }}">
    </div>
    <div class="mb-2">
      <label class="form-label">Monto de expensa mensual (Bs)</label>
      <input type="number" step="0.01" name="monto_expensa" class="form-control" value="{{ cfg.monto_expensa }}">
    </div>
    <div class="mb-2">
      <label class="form-label">Precio de agua por m³ (Bs)</label>
      <input type="number" step="0.01" name="precio_m3" class="form-control" value="{{ cfg.precio_m3 }}">
    </div>
    <div class="mb-2">
      <label class="form-label">Precio limpieza edificio (Bs)</label>
      <input type="number" step="0.01" name="precio_limpieza_edificio" class="form-control" value="{{ cfg.precio_limpieza_edificio }}">
    </div>
    <div class="mb-2">
      <label class="form-label">Precio limpieza parqueo (Bs)</label>
      <input type="number" step="0.01" name="precio_limpieza_parqueo" class="form-control" value="{{ cfg.precio_limpieza_parqueo }}">
    </div>
    <div class="mb-2">
      <label class="form-label">Multa por mora por defecto (Bs)</label>
      <input type="number" step="0.01" name="multa_mora" class="form-control" value="{{ cfg.multa_mora }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Día límite de pago (del mes)</label>
      <input type="number" name="dia_limite_pago" class="form-control" value="{{ cfg.dia_limite_pago }}">
    </div>
    <button class="btn btn-primary">Guardar cambios</button>
  </form>
</div>
{% endblock %}
